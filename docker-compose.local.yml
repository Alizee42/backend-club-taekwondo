services:
  postgres:
    image: postgres:16-alpine
    container_name: taekwondo-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taekwondodb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taekwondo-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taekwondo-local-pgdata:
