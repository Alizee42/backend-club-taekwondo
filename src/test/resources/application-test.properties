# ================================
# Configuration de la base de donn�es H2 pour les tests
# ================================
spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway cree le schema depuis V1__baseline.sql sur cette base H2 neuve.
spring.flyway.enabled=true

# ================================
# Propri�t�s sp�cifiques � l'application (tests)
# ================================
jwt.secret=test-secret-key-for-unit-tests-only-32chars
jwt.expiration=86400000

EMAIL_USERNAME=test@example.com
EMAIL_PASSWORD=fake

stripe.api.key=fake
stripe.public.key=fake
stripe.webhook.secret=fake

# ================================
# D�sactiver MongoDB pour les tests
# ================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# ================================
# R�duire les logs pour les tests
# ================================
logging.level.org.springframework=ERROR
logging.level.org.hibernate.SQL=DEBUG
