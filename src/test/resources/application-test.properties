# ================================
# Configuration de la base de données H2 pour les tests
# ================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ================================
# Propriétés spécifiques à l'application (tests)
# ================================
jwt.secret=test-secret-key
jwt.expiration=86400000

stripe.api.key=fake
stripe.public.key=fake
stripe.webhook.secret=fake

# ================================
# Désactiver MongoDB pour les tests
# ================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# ================================
# Réduire les logs pour les tests
# ================================
logging.level.org.springframework=ERROR
logging.level.org.hibernate.SQL=DEBUG
