# ========================
# PORT & PROFIL
# ========================
# Active par défaut le profil local (sauf si surchargé par --spring.profiles.active=prod)
spring.profiles.active=local
server.port=${PORT:8080}

# --- Configuration Email ---
# Gmail/Google Workspace (recommandé)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Configuration de l'application pour les emails
app.mail.from=${EMAIL_FROM:noreply@club-taekwondo.com}
app.mail.frontend-url=${FRONTEND_URL:https://frontend-club-taekwondo.netlify.app}

# ========================
# --- MySQL (Railway vars)
# ========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- MongoDB Atlas ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# --- Uploads & limites ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- API Keys ---
stripe.api.key=${STRIPE_API_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
jwt.secret=${JWT_SECRET}

# --- Logs ---
spring.security.debug=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.club.taekwondo=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# --- Active par d�faut le profil local (sauf si surcharg� par --spring.profiles.active=prod) ---
spring.profiles.active=local
