spring.application.name=backend-club-taekwondo
server.port=${PORT:8080}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${EMAIL_FROM:noreply@club-taekwondo.com}
app.mail.frontend-url=https://frontend-club-taekwondo.netlify.app

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taekwondodb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.initialization-fail-timeout=${DB_POOL_INITIALIZATION_FAIL_TIMEOUT_MS:0}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:0}

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_METADATA_ACCESS:false}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Uploads
upload.dir=uploads
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# API keys
stripe.api.key=${STRIPE_API_KEY:sk_test_dummy}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
jwt.secret=${JWT_SECRET}

# Actuator — expose uniquement /health publiquement
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=${PORT:8080}

# Swagger / OpenAPI — désactivé en prod, activé en local
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html

# Misc
spring.security.debug=false
google.drive.parentFolderId=1sYs0TW4WL3aDIbgi0pI6gB3ytq9eN5J_
logging.level.org.springframework.mail=${MAIL_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
