# ========================
# PORT & PROFIL
# ========================
# Ne force pas le profil, Railway utilise SPRING_PROFILES_ACTIVE=prod
server.port=${PORT:8080}

# ========================
# --- Configuration Email ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Config app emails
app.mail.from=${EMAIL_FROM:noreply@club-taekwondo.com}
app.mail.frontend-url=${FRONTEND_URL:https://frontend-club-taekwondo.netlify.app}

# ========================
# --- MySQL (Railway) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- MongoDB (Railway) ---
# Configuration avec priorité à la connexion interne et fallback sur l'URL publique
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_PUBLIC_URL}}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.authentication-database=admin

# Paramètres de connexion optimisés
spring.data.mongodb.connection-timeout=30000
spring.data.mongodb.socket-timeout=30000
spring.data.mongodb.max-connection-idle-time=60000
spring.data.mongodb.retry-writes=true

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# --- Uploads & limites ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- API Keys ---
stripe.api.key=${STRIPE_API_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
jwt.secret=${JWT_SECRET}

# --- Logs ---
spring.security.debug=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.club.taekwondo=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
