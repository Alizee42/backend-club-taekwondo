# ========================
# PORT
# ========================
server.port=${PORT:8080}

# --- Email ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${EMAIL_FROM:noreply@club-taekwondo.com}
app.mail.frontend-url=https://frontend-club-taekwondo.netlify.app

# ========================
# --- PostgreSQL (Render)
# ========================
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.show-sql=true

# --- MongoDB Atlas ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# --- Uploads & limites ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- API Keys ---
stripe.api.key=${STRIPE_API_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
jwt.secret=${JWT_SECRET}

# --- Logs ---
spring.security.debug=false
logging.level.org.springframework.security=INFO
google.drive.parentFolderId=1sYs0TW4WL3aDIbgi0pI6gB3ytq9eN5J_
logging.level.org.springframework.web.cors=INFO
logging.level.club.taekwondo=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

