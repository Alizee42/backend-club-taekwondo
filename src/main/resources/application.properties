# ========================
# PORT
# ========================
server.port=${PORT:8080}

# --- Email ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${EMAIL_FROM:noreply@club-taekwondo.com}
app.mail.frontend-url=https://frontend-club-taekwondo.netlify.app

# ========================
# --- PostgreSQL (Render)
# ========================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- MongoDB ---
# On Render, l'add-on MongoDB expose souvent MONGODB_URI.
# On garde la compat SPRING_DATA_MONGODB_URI (Docker, env Spring) puis on retombe sur MONGODB_URI
# et, à défaut, sur une valeur locale pour le dev.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/taekwondo_db}}

# --- Uploads & limites ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- API Keys ---
stripe.api.key=${STRIPE_API_KEY:sk_test_dummy}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
# Clé JWT: fournir une clé forte via l'env JWT_SECRET en prod (>= 32 octets). Valeur par défaut longue pour le dev.
jwt.secret=${JWT_SECRET:b14ca5898a4e4133bbce2ea2315a1916b14ca5898a4e4133bbce2ea2315a1916}

# --- Logs ---
spring.security.debug=false
logging.level.org.springframework.security=INFO
google.drive.parentFolderId=1sYs0TW4WL3aDIbgi0pI6gB3ytq9eN5J_
logging.level.org.springframework.web.cors=INFO
logging.level.club.taekwondo=DEBUG
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

