# --- Port d'ecoute ---
server.port=8080

# --- PostgreSQL (reseau Docker) ---
spring.datasource.url=jdbc:postgresql://${PGHOST:postgres}:${PGPORT:5432}/${PGDATABASE:taekwondodb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# --- CORS ---
spring.web.cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:4200
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# --- Uploads / Multipart ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Cles appli ---
stripe.api.key=${STRIPE_API_KEY:sk_test_dummy}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
jwt.secret=${JWT_SECRET:dev_secret_change_me}
