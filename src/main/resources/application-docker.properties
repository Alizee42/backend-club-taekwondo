# --- Port d'écoute ---
server.port=8080

# --- MySQL (réseau Docker) ---
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:taekwondodb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:appuser}
spring.datasource.password=${MYSQL_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Mongo (utilisateur root -> authSource=admin) ---
spring.data.mongodb.uri=mongodb://${MONGO_APP_USER:root}:${MONGO_APP_PASS:root}@mongo:27017/${MONGO_DB:taekwondo_db}?authSource=admin

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# --- CORS pour le front (localhost/Nginx ou ng serve) ---
# (Spring Boot 3.x -> spring.web.cors.* ; si tu es en 2.x, remplace par spring.mvc.cors.*)
spring.web.cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:4200
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# --- Uploads / Multipart ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Clés appli ---
stripe.api.key=${STRIPE_API_KEY:sk_test_dummy}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
jwt.secret=${JWT_SECRET:dev_secret_change_me}

