server.port=8080

# Import optional local secrets file
spring.config.import=optional:classpath:application-local-secrets.properties

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taekwondodb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# Uploads
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local test keys (override via application-local-secrets.properties or env vars)
stripe.api.key=${STRIPE_API_KEY:sk_test_dummy}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
jwt.secret=${JWT_SECRET:b14ca5898a4e4133bbce2ea2315a1916b14ca5898a4e4133bbce2ea2315a1916}

# Local email
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
app.mail.from=${EMAIL_FROM:alizee.gueye@gmail.com}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Local logs
spring.security.debug=false
logging.level.org.springframework.mail=${MAIL_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
