server.port=8080

# --- Import d'un fichier de secrets local (non versionné) ---
# Placez vos vraies clés de TEST dans `application-local-secrets.properties`.
# Ce fichier est ignoré par Git (voir .gitignore). Il sera chargé s'il existe.
spring.config.import=optional:classpath:application-local-secrets.properties

# --- JPA (local) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.show-sql=true

# --- PostgreSQL local ---
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taekwondodb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- Uploads & limites ---
upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Clés (local) ---
# Par défaut, valeurs factices (dummy). Surchargées par:
#  - variables d'environnement (STRIPE_API_KEY, STRIPE_PUBLIC_KEY, STRIPE_WEBHOOK_SECRET)
#  - ou par `application-local-secrets.properties` (non versionné)
stripe.api.key=${STRIPE_API_KEY:sk_test_dummy}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_dummy}
jwt.secret=${JWT_SECRET:b14ca5898a4e4133bbce2ea2315a1916b14ca5898a4e4133bbce2ea2315a1916}

# --- Email (local) ---
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
app.mail.from=${EMAIL_FROM:alizee.gueye@gmail.com}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:4200}

# --- DEBUG ---
spring.security.debug=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.club.taekwondo=DEBUG
logging.level.org.springframework.mail=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
