name: CI backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & tests Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (compile)
        run: ./mvnw -B -q compile

      - name: Run tests
        run: ./mvnw -B test

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats des tests Maven
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false
